<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Plan Submitted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; min-height: 100%; }
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="components/data.js"></script>
<script type="text/babel" src="components/ui.jsx"></script>

<script type="text/babel" data-presets="react">
  function SystemPlanSubmitted() {
    return (
      <>
        <HFTopNav />
        <div style={hfStyles.page}>
          <div style={hfStyles.wrap}>

            <div style={{
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              minHeight: '60vh',
              textAlign: 'center',
              gap: 24,
            }}>

              {/* Success icon */}
              <div style={{
                width: 72, height: 72, borderRadius: '50%',
                background: '#f0fdf4', border: '2px solid #bbf7d0',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                  stroke="#16a34a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 6L9 17l-5-5" />
                </svg>
              </div>

              <div>
                <div style={{ fontSize: 24, fontWeight: 700, color: '#0a0a0a', marginBottom: 8 }}>
                  System Plan Submitted
                </div>
                <div style={{ fontSize: 15, color: '#737373', maxWidth: 400, lineHeight: 1.6 }}>
                  Your system plan has been successfully submitted. Our team will review it and get back to you.
                </div>
              </div>

              <button
                onClick={() => window.location.href = 'index.html'}
                style={{ ...hfStyles.btn, ...hfStyles.btnPrimary, gap: 8, marginTop: 8 }}
              >
                Go to Home <HFArrowRight />
              </button>

            </div>

          </div>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<SystemPlanSubmitted />);
</script>
</body>
</html>
