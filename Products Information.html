<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detailed Application — Products Information</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; min-height: 100%; }
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<!-- Babel standalone for JSX -->
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared data -->
<script src="components/data.js"></script>

<!-- Screen components (load order matters) -->
<script type="text/babel" src="components/ui.jsx"></script>
<script type="text/babel" src="components/Detailed Application/basic.jsx"></script>
<script type="text/babel" src="components/Detailed Application/products.jsx"></script>
<script type="text/babel" src="components/Detailed Application/sites.jsx"></script>
<script type="text/babel" src="components/Detailed Application/review.jsx"></script>
<script type="text/babel" src="components/Detailed Application/submitted.jsx"></script>

<!-- App entry point -->
<script type="text/babel" data-presets="react">
  const CGI_STORAGE_KEY = 'cgi.detailedApp.v1';

  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(CGI_STORAGE_KEY)) || {}; } catch { return {}; }
  }

  function DetailedApplication() {
    const initial = loadSaved();

    const [screen, setScreen] = React.useState('basic');
    const [applyingStandards, setApplyingStandards] = React.useState(
      initial.applyingStandards || (initial.products && initial.products.applyingStandards) || []
    );
    const [products, setProducts] = React.useState(initial.products || {
      productGroup: [], claimedMaterials: [], inputMaterials: [],
    });
    const [sites, setSites] = React.useState(initial.sites || []);

    // Persist state on every change so navigating away and returning keeps all work.
    React.useEffect(() => {
      try { localStorage.setItem(CGI_STORAGE_KEY, JSON.stringify({ screen, applyingStandards, products, sites })); } catch {}
    }, [screen, applyingStandards, products, sites]);

    // When Applying Standards changes, prune removed standards from any saved site.
    React.useEffect(() => {
      const allowed = new Set(applyingStandards);
      setSites((prev) => prev.map((s) => ({
        ...s, standards: (s.standards || []).filter((x) => allowed.has(x)),
      })));
    }, [applyingStandards.join('|')]);

    const basicDone    = applyingStandards.length > 0;
    const productsDone = basicDone && window.CGI_FIELDS.every((f) => (products[f.key] || []).length > 0);

    // Stepper index: Basic=0, Products=1, Sites=2, Review=3, submitted=4 (all done)
    const stepIndex = { basic: 0, products: 1, sites: 2, review: 3, submitted: 4 }[screen];

    const reachable = (i) => {
      if (screen === 'submitted') return false;
      if (i === 0) return true;
      if (i === 1) return basicDone;
      if (i === 2) return productsDone;
      if (i === 3) return productsDone && sites.length > 0;
      return false;
    };

    const goTo = (i) => {
      const map = { 0: 'basic', 1: 'products', 2: 'sites', 3: 'review' };
      if (reachable(i) && map[i] !== undefined) setScreen(map[i]);
    };

    return (
      <HFPageShell step={stepIndex} goTo={goTo} reachable={reachable}>
        {screen === 'basic' && (
          <HFBasic
            values={applyingStandards}
            onChange={setApplyingStandards}
            onNext={() => setScreen('products')}
          />
        )}
        {screen === 'products' && (
          <HFProducts
            values={products}
            onChange={setProducts}
            applyingStandards={applyingStandards}
            onPrev={() => setScreen('basic')}
            onNext={() => setScreen('sites')}
          />
        )}
        {screen === 'sites' && (
          <HFSites
            sites={sites}
            setSites={setSites}
            availableStandards={applyingStandards}
            onPrev={() => setScreen('products')}
            onNext={() => setScreen('review')}
          />
        )}
        {screen === 'review' && (
          <HFReview
            applyingStandards={applyingStandards}
            products={products}
            sites={sites}
            onPrev={() => setScreen('sites')}
            onSubmit={() => setScreen('submitted')}
          />
        )}
        {screen === 'submitted' && (
          <HFSubmitted
            onGoHome={() => window.location.href = 'index.html'}
          />
        )}
      </HFPageShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<DetailedApplication />);
</script>
</body>
</html>
